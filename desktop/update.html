<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<title>MoraAnime 更新</title>
<!--
  客户端的更新弹窗（main.js 的 promptUpdate）。主人 2026-10-21：不要 Windows 原生弹窗，要和客户端一样的样式。
  - 透明窗口盖住整个主窗口：半透明遮罩 + 居中卡片，看起来就是客户端里的对话框
  - 颜色由 main.js 从主窗口当前主题读出来（--c-*），亮 / 暗主题、封面取色都跟着走
  - 和 main.js 的通信不走 preload：按钮改 location.hash（#now / #later / #web），main 监听 did-navigate-in-page；
    下载进度由 main 调 window.progress(n) / window.failed(msg) 推进来
-->
<style>
  :root {
    --c-bg: #0a0c12; --c-surface: #181d29; --c-surface-2: #232a39; --c-border: #313a4d;
    --c-text: #e8ecf3; --c-text-soft: #c6cedb; --c-muted: #8f9aad;
    --c-accent: #7c9cff; --c-on-accent: #0a0c12; --c-danger: #fca5a5;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body {
    font: 14px/1.6 system-ui, "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
    color: var(--c-text); -webkit-font-smoothing: antialiased; user-select: none;
    display: grid; place-items: center; background: rgb(0 0 0 / 55%);
    animation: fade .16s ease-out;
  }
  .card {
    width: 400px; max-width: calc(100vw - 32px); padding: 24px;
    background: var(--c-surface); border: 1px solid var(--c-border); border-radius: 16px;
    box-shadow: 0 24px 64px -12px rgb(0 0 0 / 60%);
    animation: pop .2s cubic-bezier(.2, .9, .3, 1.2);
  }
  .head { display: flex; align-items: center; gap: 14px; }
  .head svg { width: 48px; height: 48px; flex-shrink: 0; border-radius: 12px;
    box-shadow: 0 4px 16px -4px rgb(255 122 184 / 45%); }
  .eyebrow { font-size: 12px; color: var(--c-muted); letter-spacing: .02em; }
  h1 { margin: 0; font-size: 18px; font-weight: 700; line-height: 1.3; }
  .ver { color: var(--c-muted); font-weight: 500; font-size: 13px; margin-left: 6px; }
  .notes { margin: 18px 0 0; padding: 14px 16px; list-style: none; background: var(--c-surface-2);
    border-radius: 12px; color: var(--c-text-soft); font-size: 13px; }
  .notes li { position: relative; padding-left: 14px; }
  .notes li + li { margin-top: 4px; }
  .notes li::before { content: ""; position: absolute; left: 0; top: .72em; width: 5px; height: 5px;
    border-radius: 50%; background: var(--c-accent); }
  .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
  button { font: inherit; font-size: 13px; font-weight: 600; border-radius: 999px; padding: 8px 18px;
    cursor: pointer; border: 1px solid transparent; transition: filter .15s, background .15s; }
  .ghost { background: transparent; color: var(--c-text-soft); border-color: var(--c-border); }
  .ghost:hover { background: var(--c-surface-2); }
  .cta { background: var(--c-accent); color: var(--c-on-accent); }
  .cta:hover { filter: brightness(1.08); }
  button:focus-visible { outline: 2px solid var(--c-accent); outline-offset: 2px; }
  .progress { margin-top: 20px; display: none; }
  .bar { height: 6px; border-radius: 999px; background: var(--c-surface-2); overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; border-radius: inherit; background: var(--c-accent); transition: width .2s; }
  .status { margin-top: 8px; font-size: 12px; color: var(--c-muted); display: flex; justify-content: space-between; }
  .err { color: var(--c-danger); font-size: 13px; margin-top: 16px; display: none; word-break: break-all; }
  body.downloading .actions { display: none; }
  body.downloading .progress { display: block; }
  body.failed .err { display: block; }
  body.failed #now { display: none; }
  body:not(.failed) #web { display: none; }
  @keyframes fade { from { opacity: 0; } }
  @keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.97); } }
</style>
</head>
<body>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="t">
    <div class="head">
      <svg viewBox="0 0 192 192" aria-hidden="true">
        <defs>
          <linearGradient id="ag" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a7dff"/><stop offset="1" stop-color="#ff7ab8"/></linearGradient>
          <linearGradient id="ah" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient>
        </defs>
        <rect width="192" height="192" rx="48" fill="url(#ag)"/>
        <rect width="192" height="192" rx="48" fill="url(#ah)"/>
        <path d="M44 146C36 118 38 94 46 76L50 42Q51 34 58 38L84 58Q96 55 108 58L134 38Q141 34 142 42L146 76C154 94 156 118 148 146Q96 168 44 146Z" fill="#fff"/>
        <ellipse cx="74" cy="108" rx="10" ry="14" fill="url(#ag)"/>
        <path d="M110 95 L110 121 L130 108Z" fill="url(#ag)" stroke="url(#ag)" stroke-width="7" stroke-linejoin="round"/>
      </svg>
      <div>
        <div class="eyebrow">发现新版本</div>
        <h1 id="t">MoraAnime <span id="v"></span><span class="ver" id="cur"></span></h1>
      </div>
    </div>
    <ul class="notes" id="notes"></ul>
    <div class="err" id="err"></div>
    <div class="actions">
      <button class="ghost" id="later">关闭</button>
      <button class="cta" id="web">去网页下载</button>
      <button class="cta" id="now" autofocus>立即更新</button>
    </div>
    <div class="progress">
      <div class="bar"><i id="bar"></i></div>
      <div class="status"><span id="st">正在下载更新</span><span id="pct">0%</span></div>
    </div>
  </div>
<script>
  const $ = (id) => document.getElementById(id);
  const send = (a) => { location.hash = a + '-' + Date.now(); };
  /** main.js 加载完调用：{ version, current, notes: [..], theme: { '--c-bg': .. } } */
  window.init = (d) => {
    for (const [k, v] of Object.entries(d.theme || {})) if (v) document.documentElement.style.setProperty(k, v);
    $('v').textContent = d.version;
    $('cur').textContent = '当前 ' + d.current;
    $('notes').replaceChildren(...(d.notes.length ? d.notes : ['修复问题，提升稳定性'])
      .map((t) => Object.assign(document.createElement('li'), { textContent: t })));
    $('now').focus();
  };
  window.progress = (p) => {
    document.body.className = 'downloading';
    $('bar').style.width = p + '%';
    $('pct').textContent = Math.floor(p) + '%';
    if (p >= 100) { $('st').textContent = '正在安装，马上重新打开'; $('pct').textContent = ''; }
  };
  window.failed = (msg) => {
    document.body.className = 'failed';
    // 具体原因（校验失败、断网…）只进日志，用户看到的是能照着做的那句
    $('err').textContent = '更新没有下载成功，请检查网络后重新打开客户端，或去网页下载安装包';
    $('web').focus();
  };
  $('now').onclick = () => send('now');
  $('later').onclick = () => send('later');
  $('web').onclick = () => send('web');
  addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !document.body.classList.contains('downloading')) send('later');
  });
</script>
</body>
</html>
